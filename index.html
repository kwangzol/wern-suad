<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตารางเวรสวดมนต์ โรงเรียนบ้านสองพี่น้อง</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gd:#2d5a3d;--gm:#4a7c59;--gl:#7aab8a;--gp:#c8dfd0;--gmist:#eaf4ee;--cr:#fdf8f0;--cbd:#e8d9c0;--br:#8b6b47;--td:#2c3e2d;--tm:#4a5e4b;--tl:#7a9080;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:var(--cr);color:var(--td);min-height:100vh;}
.container{max-width:900px;margin:0 auto;padding:0 16px;}
header{background:linear-gradient(135deg,var(--gd),var(--gm) 60%,var(--gl));margin-bottom:24px;position:relative;overflow:hidden;}
header::after{content:'🌿';position:absolute;right:24px;top:50%;transform:translateY(-50%);font-size:64px;opacity:0.15;}
.header-inner{padding:24px;}
.school-badge{display:inline-block;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.85);font-size:12px;padding:3px 10px;border-radius:20px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.2);}
header h1{font-family:'Mitr',sans-serif;font-size:clamp(18px,5vw,26px);font-weight:600;color:#fff;line-height:1.3;}
header p{color:rgba(255,255,255,0.75);font-size:14px;margin-top:4px;}
.tabs{display:flex;background:var(--gmist);border:1.5px solid var(--gp);border-radius:12px;padding:4px;margin-bottom:20px;}
.tab-btn{flex:1;padding:9px 8px;background:none;border:none;border-radius:9px;cursor:pointer;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:500;color:var(--tm);transition:all 0.2s;}
.tab-btn.active{background:var(--gm);color:#fff;box-shadow:0 2px 8px rgba(74,124,89,0.25);}
.filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.filter-bar input,.filter-bar select{flex:1;min-width:140px;padding:9px 14px;border:1.5px solid var(--cbd);border-radius:10px;background:#fff;font-family:'Sarabun',sans-serif;font-size:14px;color:var(--td);outline:none;}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--gm);}
.upcoming-card{background:linear-gradient(120deg,var(--gd),var(--gm));border-radius:14px;padding:14px 18px;margin-bottom:16px;color:#fff;display:flex;align-items:center;gap:14px;}
.upcoming-icon{font-size:32px;flex-shrink:0;}
.upcoming-label{font-size:12px;opacity:0.75;margin-bottom:2px;}
.upcoming-name{font-family:'Mitr',sans-serif;font-size:17px;font-weight:600;}
.upcoming-date{font-size:13px;opacity:0.8;margin-top:2px;}
.month-section{margin-bottom:20px;}
.month-label{font-family:'Mitr',sans-serif;font-size:13px;font-weight:500;color:var(--gd);background:var(--gmist);border-left:3px solid var(--gm);padding:6px 12px;border-radius:0 8px 8px 0;margin-bottom:8px;}
.duty-row{display:flex;align-items:center;background:#fff;border:1px solid var(--cbd);border-radius:10px;padding:11px 14px;margin-bottom:6px;gap:12px;transition:box-shadow 0.15s;}
.duty-row:hover{box-shadow:0 2px 10px rgba(74,124,89,0.12);}
.duty-row.past{opacity:0.45;}
.duty-row.today{border-color:var(--gm);box-shadow:0 0 0 2px rgba(74,124,89,0.15);}
.duty-num{width:26px;height:26px;border-radius:50%;background:var(--gmist);color:var(--gd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
.duty-date{flex:1;font-size:13px;color:var(--tm);}
.duty-date strong{display:block;font-size:14px;color:var(--td);font-weight:500;}
.duty-teacher{font-size:13px;font-weight:500;color:var(--gd);text-align:right;flex-shrink:0;}
.swap-badge{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:500;margin-left:6px;}
.swap-pending{background:#fef3c7;color:#92400e;}
.swap-done{background:#d1fae5;color:#065f46;}
.btn-swap{padding:5px 10px;border-radius:8px;background:#f5ead8;border:1px solid var(--cbd);color:var(--br);font-size:12px;font-weight:500;cursor:pointer;font-family:'Sarabun',sans-serif;transition:all 0.15s;flex-shrink:0;}
.btn-swap:hover{background:var(--gp);border-color:var(--gl);color:var(--gd);}
.actions{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.btn-primary{padding:9px 18px;border-radius:10px;background:var(--gm);border:none;color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:'Sarabun',sans-serif;}
.btn-primary:hover{background:var(--gd);}
.btn-secondary{padding:9px 18px;border-radius:10px;background:#fff;border:1.5px solid var(--cbd);color:var(--tm);font-size:14px;font-weight:500;cursor:pointer;font-family:'Sarabun',sans-serif;}
.btn-secondary:hover{border-color:var(--gl);color:var(--gd);}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(44,62,45,0.5);z-index:100;align-items:center;justify-content:center;padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:var(--cr);border-radius:16px;padding:24px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.modal h2{font-family:'Mitr',sans-serif;font-size:17px;margin-bottom:4px;color:var(--gd);}
.modal p{font-size:13px;color:var(--tl);margin-bottom:16px;}
.form-group{margin-bottom:12px;}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:4px;color:var(--tm);}
.form-group select,.form-group textarea{width:100%;padding:8px 11px;border:1.5px solid var(--cbd);border-radius:9px;font-family:'Sarabun',sans-serif;font-size:13px;background:#fff;color:var(--td);outline:none;}
.form-group select:focus,.form-group textarea:focus{border-color:var(--gm);}
.form-group textarea{height:70px;resize:none;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.modal-actions .btn-primary,.modal-actions .btn-secondary{flex:1;}
.swap-item{background:#fff;border:1px solid var(--cbd);border-radius:10px;padding:13px 15px;margin-bottom:8px;}
.swap-item .si-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.swap-item .si-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;}
.swap-item .si-id{font-size:12px;color:var(--tl);}
.swap-item .si-body{font-size:13px;color:var(--tm);line-height:1.7;}
.swap-item .si-body strong{color:var(--td);}
.swap-item .si-actions{display:flex;gap:8px;margin-top:10px;}
.btn-confirm{padding:6px 12px;border-radius:8px;background:var(--gmist);border:1px solid var(--gp);color:var(--gd);font-size:12px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;}
.btn-cancel-swap{padding:6px 12px;border-radius:8px;background:#fff5f5;border:1px solid #fecaca;color:#dc2626;font-size:12px;font-weight:600;cursor:pointer;font-family:'Sarabun',sans-serif;}
.empty-state{text-align:center;padding:48px 24px;color:var(--tl);}
.empty-state .icon{font-size:48px;display:block;margin-bottom:12px;}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:24px;}
.summary-card{background:#fff;border:1px solid var(--cbd);border-radius:12px;padding:13px 15px;}
.summary-card .sc-name{font-size:12px;color:var(--tm);margin-bottom:4px;}
.summary-card .sc-num{font-family:'Mitr',sans-serif;font-size:22px;color:var(--gd);font-weight:600;}
.summary-card .sc-sub{font-size:11px;color:var(--tl);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.loading{text-align:center;padding:40px;color:var(--tl);font-size:14px;}
@media print{header::after,.tabs,.filter-bar,.actions,.btn-swap,.modal-bg,.toast{display:none!important;}body{background:white;}}
</style>
</head>
<body>
<header>
  <div class="header-inner container">
    <div class="school-badge">โรงเรียนบ้านสองพี่น้อง · สพป.ระยอง เขต ๒</div>
    <h1>ตารางเวรสวดมนต์ประจำวัน</h1>
    <p>ปีการศึกษา ๒๕๖๙ · ทุกวันศุกร์</p>
  </div>
</header>
<div class="container">
  <div id="upcomingBanner"></div>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('schedule')">📅 ตารางเวร</button>
    <button class="tab-btn" onclick="switchTab('swaps')">🔄 คำขอแลกเวร</button>
    <button class="tab-btn" onclick="switchTab('summary')">📊 สรุป</button>
  </div>
  <div id="tab-schedule">
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="🔍 ค้นหาชื่อครู..." oninput="renderSchedule()">
      <select id="termFilter" onchange="renderSchedule()">
        <option value="0">ทุกภาคเรียน</option>
        <option value="1">ภาคเรียนที่ 1</option>
        <option value="2">ภาคเรียนที่ 2</option>
      </select>
    </div>
    <div class="actions">
      <button class="btn-primary" onclick="window.print()">🖨️ พิมพ์ตาราง</button>
      <button class="btn-secondary" onclick="refreshData()">🔄 รีเฟรช</button>
    </div>
    <div id="scheduleList"><div class="loading">⏳ กำลังโหลด...</div></div>
  </div>
  <div id="tab-swaps" style="display:none">
    <div class="actions"><button class="btn-secondary" onclick="refreshData()">🔄 รีเฟรช</button></div>
    <div id="swapList"></div>
  </div>
  <div id="tab-summary" style="display:none">
    <div id="summaryContent"></div>
  </div>
</div>
<div class="modal-bg" id="swapModal">
  <div class="modal">
    <h2>ขอแลกเวรสวดมนต์</h2>
    <p>เลือกวันและครูที่ต้องการแลกเวรด้วย</p>
    <div class="form-group">
      <label>เวรของฉัน (วันที่ต้องการแลกออก)</label>
      <select id="swapFromDate"></select>
    </div>
    <div class="form-group">
      <label>แลกกับวันที่</label>
      <select id="swapToDate"></select>
    </div>
    <div class="form-group">
      <label>หมายเหตุ (ถ้ามี)</label>
      <textarea id="swapNote" placeholder="เช่น ติดธุระสำคัญ..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">ยกเลิก</button>
      <button class="btn-primary" onclick="submitSwap()">ส่งคำขอแลกเวร</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx8R2fHzusI2e4cQ2taR0m9miDY71c2udoG9KzCi23w0bnujSzrAkZD9XUu0gzNhj_x/exec";
let schedule = [];
let swapRequests = [];
let cbCount = 0;

function jsonp(params) {
  return new Promise((resolve, reject) => {
    const cbName = '__cb' + (cbCount++);
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      delete window[cbName];
      document.body.removeChild(script);
      reject(new Error('timeout'));
    }, 10000);
    window[cbName] = function(data) {
      clearTimeout(timeout);
      delete window[cbName];
      document.body.removeChild(script);
      resolve(data);
    };
    params.callback = cbName;
    script.src = SCRIPT_URL + '?' + new URLSearchParams(params);
    script.onerror = () => { clearTimeout(timeout); reject(new Error('error')); };
    document.body.appendChild(script);
  });
}

async function loadData() {
  try {
    const [sched, swaps] = await Promise.all([
      jsonp({action:'getSchedule'}),
      jsonp({action:'getSwapRequests'})
    ]);
    if (Array.isArray(sched)) schedule = sched.map(r => ({...r, term: Number(r.term)}));
    if (Array.isArray(swaps)) swapRequests = swaps;
  } catch(e) {
    showToast('⚠️ โหลดข้อมูลไม่ได้ กรุณารีเฟรช');
  }
}

function todayStr() { return new Date().toISOString().split('T')[0]; }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function renderUpcoming() {
  const today = todayStr();
  const upcoming = schedule.find(s => s.date >= today);
  const el = document.getElementById('upcomingBanner');
  if (!upcoming) { el.innerHTML = ''; return; }
  const isToday = upcoming.date === today;
  el.innerHTML = `<div class="upcoming-card"><div class="upcoming-icon">${isToday?'🔔':'📌'}</div><div><div class="upcoming-label">${isToday?'วันนี้มีเวรสวดมนต์!':'เวรสวดมนต์ครั้งถัดไป'}</div><div class="upcoming-name">${upcoming.teacher}</div><div class="upcoming-date">${upcoming.display}</div></div></div>`;
}

function renderSchedule() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const term = parseInt(document.getElementById('termFilter').value);
  const today = todayStr();
  const filtered = schedule.filter(s => {
    if (term && s.term !== term) return false;
    if (search && !s.teacher.toLowerCase().includes(search)) return false;
    return true;
  });
  const months = {};
  filtered.forEach(s => {
    const key = s.date.substring(0,7);
    if (!months[key]) months[key] = [];
    months[key].push(s);
  });
  const pending = swapRequests.filter(r => r.status === 'รอยืนยัน');
  let html = ''; let num = 1;
  for (const rows of Object.values(months)) {
    const parts = rows[0].display.split(' ');
    // display = "วันศุกร์ที่ 22 พฤษภาคม พ.ศ. 2569"
    // parts:  0       1   2          3     4    5
    const monthLabel = parts.slice(2).join(' ');
    html += `<div class="month-section"><div class="month-label">📅 ${monthLabel}</div>`;
    rows.forEach(s => {
      const isPast = s.date < today, isToday2 = s.date === today;
      const hp = pending.find(r => r.fromDate===s.date||r.toDate===s.date);
      const hd = swapRequests.find(r => r.status==='แลกแล้ว'&&(r.fromDate===s.date||r.toDate===s.date));
      const badge = hp?'<span class="swap-badge swap-pending">รอแลก</span>':hd?'<span class="swap-badge swap-done">แลกแล้ว</span>':'';
      html += `<div class="duty-row${isPast?' past':''}${isToday2?' today':''}"><div class="duty-num">${num}</div><div class="duty-date"><strong>${s.display}</strong>ภาคเรียนที่ ${s.term}</div><div class="duty-teacher">${s.teacher}${badge}</div>${!isPast?`<button class="btn-swap" onclick="openSwapModal('${s.date}')">แลกเวร</button>`:''}</div>`;
      num++;
    });
    html += '</div>';
  }
  if (!html) html = '<div class="empty-state"><span class="icon">🌿</span><p>ไม่พบข้อมูล</p></div>';
  document.getElementById('scheduleList').innerHTML = html;
}

function openSwapModal(fromDate) {
  const today = todayStr();
  const fromEntry = schedule.find(s => s.date === fromDate);
  document.getElementById('swapFromDate').innerHTML = `<option value="${fromDate}">${fromEntry.display} — ${fromEntry.teacher}</option>`;
  document.getElementById('swapToDate').innerHTML = schedule.filter(s => s.date !== fromDate && s.date >= today).map(s => `<option value="${s.date}">${s.display} — ${s.teacher}</option>`).join('');
  document.getElementById('swapNote').value = '';
  document.getElementById('swapModal').classList.add('open');
}

function closeModal() { document.getElementById('swapModal').classList.remove('open'); }

async function submitSwap() {
  const fromDate = document.getElementById('swapFromDate').value;
  const toDate = document.getElementById('swapToDate').value;
  const note = document.getElementById('swapNote').value;
  const fromEntry = schedule.find(s => s.date === fromDate);
  const toEntry = schedule.find(s => s.date === toDate);
  closeModal(); showToast('⏳ กำลังส่งคำขอ...');
  try {
    await jsonp({action:'requestSwap', fromDate, fromTeacher: fromEntry.teacher, toDate, toTeacher: toEntry.teacher, note});
    await loadData(); renderSchedule(); renderSwaps(); renderUpcoming();
    showToast('✅ ส่งคำขอแลกเวรแล้ว รอการยืนยัน');
  } catch(e) { showToast('❌ เกิดข้อผิดพลาด กรุณาลองใหม่'); }
}

async function confirmSwap(id) {
  showToast('⏳ กำลังยืนยัน...');
  try {
    await jsonp({action:'confirmSwap', id});
    await loadData();
    switchTab('schedule');
    renderSchedule(); renderUpcoming();
    showToast('✅ ยืนยันการแลกแล้ว ตารางอัปเดตแล้ว');
  } catch(e) { showToast('❌ เกิดข้อผิดพลาด'); }
}

async function cancelSwap(id) {
  try {
    await jsonp({action:'cancelSwap', id});
    await loadData(); renderSwaps(); renderSchedule();
    showToast('ยกเลิกคำขอแล้ว');
  } catch(e) { showToast('❌ เกิดข้อผิดพลาด'); }
}

function renderSwaps() {
  const active = swapRequests.filter(r => r.status !== 'ยกเลิก');
  const el = document.getElementById('swapList');
  if (!active.length) { el.innerHTML = '<div class="empty-state"><span class="icon">🌿</span><p>ยังไม่มีคำขอแลกเวร</p></div>'; return; }
  const sc = {'รอยืนยัน':'#fef3c7;color:#92400e','แลกแล้ว':'#d1fae5;color:#065f46'};
  el.innerHTML = [...active].reverse().map(r => `<div class="swap-item"><div class="si-top"><span class="si-badge" style="background:${sc[r.status]||'#f3f4f6;color:#374151'}">${r.status}</span><span class="si-id">รหัส: ${r.id}</span><span class="si-id" style="margin-left:auto">${r.timestamp}</span></div><div class="si-body"><strong>${r.fromTeacher}</strong> ขอแลกเวรวันที่ <strong>${r.fromDate}</strong> กับ <strong>${r.toTeacher}</strong> วันที่ <strong>${r.toDate}</strong>${r.note?`<br><em style="color:var(--tl)">หมายเหตุ: ${r.note}</em>`:''}</div>${r.status==='รอยืนยัน'?`<div class="si-actions"><button class="btn-confirm" onclick="confirmSwap('${r.id}')">✅ ยืนยันการแลก</button><button class="btn-cancel-swap" onclick="cancelSwap('${r.id}')">✕ ยกเลิก</button></div>`:''}</div>`).join('');
}

function renderSummary() {
  const counts = {}; const today = todayStr(); const rem = {};
  schedule.forEach(s => { if(!counts[s.teacher]) counts[s.teacher]={s1:0,s2:0}; counts[s.teacher]['s'+s.term]++; });
  schedule.filter(s => s.date >= today).forEach(s => { if(!rem[s.teacher]) rem[s.teacher]=0; rem[s.teacher]++; });
  let html = '<div class="summary-grid">';
  for (const [name, c] of Object.entries(counts)) {
    html += `<div class="summary-card"><div class="sc-name">${name}</div><div class="sc-num">${c.s1+c.s2} <span style="font-size:14px;font-weight:400">วัน</span></div><div class="sc-sub">เทอม 1: ${c.s1} · เทอม 2: ${c.s2} · เหลือ: ${rem[name]||0}</div></div>`;
  }
  html += '</div>';
  document.getElementById('summaryContent').innerHTML = html;
}

function switchTab(tab) {
  ['schedule','swaps','summary'].forEach(t => { document.getElementById('tab-'+t).style.display = t===tab?'':'none'; });
  document.querySelectorAll('.tab-btn').forEach((b,i) => { b.classList.toggle('active',['schedule','swaps','summary'][i]===tab); });
  if (tab==='swaps') renderSwaps();
  if (tab==='summary') renderSummary();
}

async function refreshData() {
  showToast('⏳ กำลังโหลด...');
  await loadData(); renderSchedule(); renderUpcoming();
  showToast('✅ อัปเดตแล้ว');
}

document.getElementById('swapModal').addEventListener('click', function(e) { if(e.target===this) closeModal(); });
loadData().then(() => { renderUpcoming(); renderSchedule(); });
</script>
</body>
</html>
